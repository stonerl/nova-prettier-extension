# Basic query with arguments and aliases
query getUserInfo($id: ID!, $verbose: Boolean = false) {
  user: userById(id: $id) {
    id
    name
    email
    profilePicture(size: 100)
    address {
      street
      city
      zip
    }
    friends(first: 10) {
      edges {
        node {
          id
          name
        }
      }
    }
    ...UserDetails
  }
}

# Fragment with nested fields
fragment UserDetails on User {
  bio
  joinedDate
  posts(limit: 5) {
    title
    published
    tags
  }
}

# Mutation example
mutation updateUser($input: UpdateUserInput!) {
  updateUser(input: $input) {
    user {
      id
      name
      email
    }
    success
    error {
      message
      code
    }
  }
}

# Subscription example
subscription onNewMessage {
  messageSent {
    id
    content
    sender {
      id
      username
    }
  }
}

# Schema Definition Language
scalar DateTime

enum Role {
  ADMIN
  EDITOR
  VIEWER
}

input CreateUserInput {
  username: String!
  email: String @deprecated(reason: "Use `username`")
  role: Role = VIEWER
}

interface Node {
  id: ID!
}

union SearchResult = User | Post

type User implements Node @key(fields: "id") {
  id: ID!
  username: String!
  role: Role
  createdAt: DateTime
}

type Query {
  user(id: ID!): User
  search(term: String, first: Int = 10): [SearchResult!]!
}

directive @auth(role: Role) on FIELD_DEFINITION | OBJECT

# Usage with directives
query conditionalFetch($verbose: Boolean! = false) {
  user(id: "4") {
    id
    email @include(if: $verbose)
    role @skip(if: false)
  }
}
